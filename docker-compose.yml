# =============================================
# GlowManager Pro — Docker Compose (Desarrollo Local)
# =============================================
# PUERTOS (sin conflictos con contenedores existentes detectados):
#   - ferresys-db             → 5437
#   - restaurante-hernandez   → 3003
#   - taller_vargas_backend   → 3001
#   - taller_vargas_db        → 5436
#   - valeventas-frontend     → 3005
#
#   glowmanager_frontend      → 5175 ✅
#   glowmanager_backend       → 3004 ✅
#   glowmanager_db            → 5441 ✅
# =============================================
# ARRANQUE MANUAL (NO auto-start):
#   docker compose up -d          → Levantar todos
#   docker compose up -d backend  → Solo el backend
#   docker compose down           → Bajar todos
# =============================================

services:

  # ── BASE DE DATOS ──────────────────────────
  glowmanager_db:
    image: postgres:16-alpine
    container_name: glowmanager_db
    restart: "no"                         # ← No auto-start al abrir Docker
    environment:
      TZ: ${TZ:-America/Lima}
      POSTGRES_USER: ${POSTGRES_USER:-glowmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glowpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-glowmanager_db}
    ports:
      - "${DB_PORT:-5441}:5432"                       # ← Puerto en el host
    volumes:
      - glowmanager_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glowmanager} -d ${POSTGRES_DB:-glowmanager_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── BACKEND API ────────────────────────────
  glowmanager_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glowmanager_backend
    restart: "no"                         # ← No auto-start al abrir Docker
    environment:
      TZ: ${TZ:-America/Lima}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-glowmanager}:${POSTGRES_PASSWORD:-glowpassword123}@glowmanager_db:5432/${POSTGRES_DB:-glowmanager_db}
      BACKEND_PORT: ${BACKEND_PORT:-3004}
      JWT_SECRET: ${JWT_SECRET:-d819c98a5e12f6b8e3a241764cb89d9e03487f981e74f76269b182cf5910be3a}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5175}
    ports:
      - "${BACKEND_PORT:-3004}:${BACKEND_PORT:-3004}"
    depends_on:
      glowmanager_db:
        condition: service_healthy
    volumes:
      # Hot-reload en desarrollo: sincroniza el código fuente
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src

  # ── FRONTEND ───────────────────────────────
  glowmanager_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glowmanager_frontend
    restart: "no"                         # ← No auto-start al abrir Docker
    environment:
      VITE_API_URL: ""
    ports:
      - "${FRONTEND_PORT:-5175}:5175"
    depends_on:
      - glowmanager_backend
    volumes:
      # Hot-reload del frontend en desarrollo
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/index.html:/app/index.html

# ── VOLÚMENES ──────────────────────────────
volumes:
  glowmanager_postgres_data:
    name: glowmanager_postgres_data
